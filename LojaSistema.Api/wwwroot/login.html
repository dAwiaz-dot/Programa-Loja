<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin | Nana Modas</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap">
    <link rel="stylesheet" href="/login.css">
</head>
<body>
    <main class="login-page">
        <section class="login-card">
            <div class="login-brand">
                <span>NM</span>
                <div>
                    <strong>Nana Modas</strong>
                    <small>Painel administrativo</small>
                </div>
            </div>

            <div class="login-copy">
                <p>Área restrita</p>
                <h1>Entrar no painel</h1>
            </div>

            <form class="login-form" id="loginForm">
                <label>
                    Usuário
                    <input id="usuario" type="text" autocomplete="username" required>
                </label>

                <label>
                    Senha
                    <input id="senha" type="password" autocomplete="current-password" required>
                </label>

                <button type="submit">Entrar</button>
                <p class="login-error" id="loginError" role="alert"></p>
            </form>

            <a class="store-link" href="/loja.html">Voltar para a loja</a>
        </section>
    </main>

    <script src="/login.js" defer></script>
</body>
</html>
